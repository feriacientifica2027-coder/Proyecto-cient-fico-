<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194D3B">
  <title>Consulta de proyectos | Feria Científica</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand-mark">FC</div>
    <div>
      <p class="eyebrow">Instituto Benigno Jiménez Garay</p>
      <h1>Consulta de proyectos</h1>
    </div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="inscripcion.html">Inscripción</a>
    </nav>
  </div>
</header>

<main class="container narrow">
  <section class="intro">
    <p class="eyebrow">Seguimiento institucional</p>
    <h2>Consulta el estado de tu proyecto</h2>
    <p>
      Introduce el código asignado y el correo electrónico utilizado
      durante la inscripción.
    </p>
  </section>

  <section class="panel">
    <form id="consultaForm">
      <label for="codigo">
        Código del proyecto
        <input
          type="text"
          id="codigo"
          name="codigo"
          required
          maxlength="20"
          placeholder="Ej. TM-BIO-001"
          pattern="(TM|TV)-(BIO|CAM|CCO|CSC|FMA|INY|QUI|SYM)-[0-9]{3}"
          title="Formato: TM-BIO-001 o TV-QUI-001"
          autocomplete="off">
      </label>

      <label for="correo">
        Correo electrónico de inscripción
        <input
          type="email"
          id="correo"
          name="correo"
          required
          maxlength="160"
          placeholder="equipo@correo.com"
          autocomplete="email">
      </label>

      <button class="button primary full" type="submit">Consultar proyecto</button>
    </form>

    <div id="consultaResult" class="result-box" aria-live="polite" role="status"></div>
  </section>
</main>

<footer>
  <div class="container">Feria Científica · Instituto Benigno Jiménez Garay</div>
</footer>

<script src="js/config.js"></script>
<script src="js/consulta.js"></script>
</body>
</html>
